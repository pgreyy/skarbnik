# Kintsugi Rust workspace: the NEAR contract, the native patch checker, the proof harness
# (which compiles the zkVM guest) and the host that proves and verifies. scripts/build_all.sh builds all of it.
[workspace]
resolver = "3"
members = ["contract", "harness", "host", "harness/checker"]
# near-sdk refuses a plain native `cargo build` of a contract, so a bare `cargo build` builds only
# the proof side. scripts/build_all.sh builds everything: this, then `cargo near build` for the contract.
default-members = ["harness", "host", "harness/checker"]

# The zkVM guests are built by harness/build.rs with the RISC Zero toolchain, not by this workspace.
exclude = ["harness/guest", "harness/check-guest"]

# Always optimize; building and running zkVM code is very slow without it.
[profile.dev]
opt-level = 3

# Settings from the cargo-near template, so the contract wasm stays small and safe.
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
