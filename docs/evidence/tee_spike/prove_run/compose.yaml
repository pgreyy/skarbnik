# What Phala Cloud runs in the CVM for the confidential proving spike: our sealed checker and prover image, pinned by
# digest, with the dstack guest agent socket (for TDX quotes) and port 8080 behind Phala's gateway.
services:
  tee:
    image: ghcr.io/pgreyy/skarbnik-tee@sha256:60f6bcf3862b67e91bb92858831c1279f28e6167131ee5eae94793933fabeb3d
    ports:
      - "8080:8080"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    restart: on-failure
