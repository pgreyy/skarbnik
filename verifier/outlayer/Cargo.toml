# The verifier program for OutLayer (spike S4): reads one receipt and the values it must match from
# standard input, checks the receipt with RISC Zero's verify-only code, and prints a short JSON answer.
# Builds natively (for tests on the laptop) and for wasm32-wasip1 (to run on OutLayer).
[package]
name = "farbox-verifier"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "farbox-verifier"
path = "src/main.rs"

[dependencies]
kintsugi-check = { path = "../../harness/checker", default-features = false, features = ["zk"] }
# Verify only: no prover, no client, no remote service.
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std"] }
bincode = "=1.3.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
