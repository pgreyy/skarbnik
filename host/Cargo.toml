# The host program: runs the zkVM guests, produces proofs (receipts), verifies them, and measures
# cycles, time and receipt size. Commands: hello, execute, prove, verify, tamper, compress.
[package]
name = "skarbnik-host"
version = "0.1.0"
edition = "2021"

[dependencies]
kintsugi-harness = { path = "../harness" }
kintsugi-check = { path = "../harness/checker", features = ["zk"] }
# "client" proves through the locally installed r0vm. The default "bonsai" feature (remote proving
# service) is left out on purpose: the vendor's secret input must never leave the vendor's machine.
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["client"] }
# Receipt files on disk.
bincode = "=1.3.3"
# Only for the `cuda-prove-only` feature below (GPU proving): the circuits whose own `cuda` features it turns on.
risc0-zkp = { version = "=3.0.5", optional = true, default-features = false }
risc0-circuit-rv32im = { version = "=4.0.5", optional = true, default-features = false }
risc0-circuit-recursion = { version = "=4.0.5", optional = true, default-features = false }
risc0-circuit-keccak = { version = "=4.0.6", optional = true, default-features = false }

[features]
# For a machine with an NVIDIA GPU (see notes on the GPU test): proves inside this process with CUDA
# instead of through the r0vm program. Needs the CUDA toolkit to build. Off by default.
cuda = ["risc0-zkvm/cuda"]
# For GPU proving only: like `cuda`, but without RISC Zero's GPU Groth16 part (its `circom-witnesscalc` dependency needs
# extra system packages and failed to build on the first rented GPU). Proves and compresses to succinct on the GPU;
# Groth16 compression is not available in this build. Needs the CUDA toolkit to build. Off by default.
cuda-prove-only = [
    "risc0-zkvm/prove",
    "dep:risc0-zkp", "risc0-zkp/cuda",
    "dep:risc0-circuit-rv32im", "risc0-circuit-rv32im/cuda",
    "dep:risc0-circuit-recursion", "risc0-circuit-recursion/cuda",
    "dep:risc0-circuit-keccak", "risc0-circuit-keccak/cuda",
]
