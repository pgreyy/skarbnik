# Wraps a succinct RISC Zero receipt into a Groth16 receipt (the small proof the bounty contract checks), on a GitHub
# runner with Docker, so the vendor's own machine does no heavy work. It runs when a push to ui-preview changes
# ci/groth16-request.txt (one line: the receipt's path in the repository); a manual start from the Actions tab needs the
# workflow on the default branch, which this repository's work does not push to.
# Input: a succinct receipt committed to the repository. A receipt holds only hashes, the seed, counts, the submission id
# and the verdict: never the secret input, the salt or a key. Steps: rebuild the checker reproducibly and refuse to go
# on unless its image id is the published one (scripts/check_image_id.sh), wrap to Groth16 in RISC Zero's Docker
# prover, verify the result, write the contract arguments, upload them as an artifact.
name: groth16-wrap
on:
  push:
    branches: [ui-preview]
    paths: [ci/groth16-request.txt]
permissions:
  contents: read
jobs:
  wrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Disk and memory (the builder image is 7.46 GB unpacked; the Groth16 prover needs about 7 GiB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 8G /mnt/wrap-swap && sudo chmod 600 /mnt/wrap-swap && sudo mkswap /mnt/wrap-swap && sudo swapon /mnt/wrap-swap
          df -h / /mnt; free -h; nproc
      - name: Rust 1.99.1 and RISC Zero 3.0.6
        run: |
          rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
          curl --proto '=https' --tlsv1.2 -sSfL https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          "$HOME/.risc0/bin/rzup" install cargo-risczero 3.0.6
          "$HOME/.risc0/bin/rzup" install r0vm 3.0.6
          rustc --version; "$HOME/.risc0/bin/rzup" show
      - name: Rebuild the checker and compare its image id with the published one
        run: ./scripts/check_image_id.sh
      - name: Build the host
        run: cargo build --release -p skarbnik-host
      - name: Wrap to Groth16
        run: |
          RECEIPT=$(head -1 ci/groth16-request.txt | tr -d '[:space:]'); test -f "$RECEIPT"
          mkdir -p out
          sha256sum "$RECEIPT" | tee out/input_sha256.txt
          RISC0_DEV_MODE=0 /usr/bin/time -v ./target/release/skarbnik-host compress "$RECEIPT" out/groth16.bin groth16 2>&1 | tee out/groth16.log
          ./target/release/skarbnik-host verify out/groth16.bin | tee out/verify.txt
          grep -q '^VALID' out/verify.txt
          ./target/release/skarbnik-host groth16-args out/groth16.bin out/args.json
      - uses: actions/upload-artifact@v4
        with:
          name: groth16
          path: out/
