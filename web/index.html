<!doctype html>
<!-- Skarbnik site (testnet). The page shell: header (mark, menu with number keys, wallet control), the main view,
     the fixed footer (intro replay, theme switch, Private toggle), the shortcuts panel, the credit and
     confirm dialogs, toast, live region and the intro layer. js/app.js renders each screen into <main> from live testnet
     data and from the recorded files in data/. Transactions are only ever signed in the visitor's wallet after a
     confirm step (js/wallet.js); this page holds no key. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skarbnik · Fix what you can’t see</title>
<meta name="description" content="Bounties for bugs that only crash on a secret input. Live view of the Skarbnik contract on NEAR testnet.">
<link rel="canonical" href="https://skarbnik.xyz/">
<meta property="og:url" content="https://skarbnik.xyz/">
<meta property="og:title" content="Skarbnik · Fix what you can’t see">
<meta property="og:description" content="Fix what you can’t see. Bounties for bugs that only crash on a secret input, on NEAR testnet.">
<meta property="og:image" content="https://skarbnik.xyz/social.png?v=s12">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0A1424" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
<link rel="icon" href="favicon.svg?v=s12" type="image/svg+xml">
<link rel="icon" href="favicon-48.png?v=s12" type="image/png" sizes="48x48">
<link rel="icon" href="favicon-32.png?v=s12" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-16.png?v=s12" type="image/png" sizes="16x16">
<link rel="shortcut icon" href="favicon.ico?v=s12" type="image/x-icon">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=s12" sizes="180x180">
<link rel="manifest" href="site.webmanifest?v=s12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=IBM+Plex+Sans:wght@500;600&family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&text=Skarbnik&display=swap">
<link rel="stylesheet" href="css/app.css">
<script>
  // Set the theme before the first paint (the visitor's system setting, or their saved choice), so the page never flashes.
  (function () {
    var p = 'system', priv = 'off';
    try { p = localStorage.getItem('skarbnik-theme') || 'system'; priv = localStorage.getItem('skarbnik-private') || 'off'; } catch (e) { /* storage blocked */ }
    var t = p === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : p;
    document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    document.documentElement.setAttribute('data-private', priv === 'on' ? 'on' : 'off');
  })();
</script>
</head>
<body>
<div class="k-bg" aria-hidden="true"><div class="k-cursor" id="cursorGlow"></div></div>
<div class="m-app" id="app">
  <a class="k-skip" href="#main">Skip to content</a>
  <header class="m-hd">
    <div class="k-left"><a class="m-brand" href="#/" id="brand" aria-label="Skarbnik, home"></a></div>
    <nav class="m-nav" aria-label="Main">
      <a href="#/bounties" data-nav="bounties" data-key="1"><span class="k-key" aria-hidden="true">[1]</span>Bounties</a>
      <a href="#/arena" data-nav="arena" data-key="2"><span class="k-key" aria-hidden="true">[2]</span>Arena</a>
      <a href="#/verify" data-nav="verify" data-key="3"><span class="k-key" aria-hidden="true">[3]</span>How to verify</a>
      <a href="#/agents" data-nav="agents" data-key="4"><span class="k-key" aria-hidden="true">[4]</span>For agents</a>
    </nav>
    <div class="k-wallet" id="walletArea" aria-live="polite"></div>
  </header>
  <main class="m-view" id="main" tabindex="-1"><p class="k-state">Loading…</p></main>
  <footer class="m-foot">
    <div class="k-footl">
      <button class="m-link" type="button" id="replayIntro">Replay the intro</button>
      <div class="m-themebar" role="group" aria-label="Colour mode">
        <button type="button" data-pref="light" aria-pressed="false">Light</button>
        <button type="button" data-pref="dark" aria-pressed="false">Dark</button>
        <button type="button" data-pref="system" aria-pressed="true">System</button>
      </div>
    </div>
    <button class="k-privbtn" type="button" id="privBtn" aria-pressed="false" title="Blur balances and account names"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Private</button>
  </footer>
  <dialog class="k-sheet" id="creditDlg" aria-labelledby="creditTitle"></dialog>
  <dialog class="k-sheet k-conf" id="confirmDlg" aria-labelledby="confTitle"></dialog>
  <div class="m-toast" role="status" id="toast" hidden></div>
  <div class="sr-only" role="status" aria-live="polite" id="live"></div>
</div>
<div class="k-keys" id="keys" hidden>
  <div role="dialog" aria-modal="true" aria-labelledby="keysTitle">
    <h2 id="keysTitle">Keyboard shortcuts</h2>
    <dl>
      <dt><kbd>1</kbd></dt><dd>Bounties</dd>
      <dt><kbd>2</kbd></dt><dd>Arena</dd>
      <dt><kbd>3</kbd></dt><dd>How to verify</dd>
      <dt><kbd>4</kbd></dt><dd>For agents</dd>
      <dt><kbd>?</kbd></dt><dd>Show or hide this</dd>
      <dt><kbd>Esc</kbd></dt><dd>Close</dd>
    </dl>
  </div>
</div>
<div class="k-int" id="intro" hidden></div>
<noscript><p style="padding:24px;font-family:sans-serif">This site reads live data from NEAR testnet and needs JavaScript. The agent files work without it: feed.json and agent-quickstart.txt.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
