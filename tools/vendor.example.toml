# skarbnik-vendor bounty config: a template with placeholder paths. Copy it with `tools/skarbnik-vendor init --out <path>`
# (or `--from <an older config>` to reuse the settings: only the secret and the fix change). Real configs name your
# secret files: keep them outside the repository. See docs/VENDOR.md.

[bounty]
name = "mybounty"            # also names the bounty's private salt, ~/.kintsugi-salts/<name>.salt (made at the first proof)
mode = "crash"               # crash: the original crashes on the secret input. output: it returns a wrong answer there
                             # (also memory safety bugs that corrupt memory without crashing). rule: the original breaks
                             # the public rule module (path traversal, injection, access control); see docs/VENDOR.md
sweep = "0"                  # output and rule modes: private byte positions of the secret tried with all 256 values
                             # (at most 4; the secret line must end with the same sweep=<p>,<p>); each adds about 32
                             # million cycles to every proof
module = "data/demo"         # folder with original.wasm and public_tests.txt (rule mode: also rule.wasm)
# rule = "data/mymodule/rule.wasm"   # rule mode only: the public rule module (default <module>/rule.wasm)
reward_near = "0.1"
k = 1                        # attempts allowed (1 to 16): each verdict tells at most one bit about the secret
max_commits_per_account = 0   # most attempt slots one account may hold at a time (1 to K); 0 = no cap
level = 2                    # 2: the contract checks a Groth16 proof itself (default). 1: the contract trusts OutLayer running
                             # the pinned verifier program (no Groth16 step; about 0.011 NEAR a check, about 2.8 NEAR held and
                             # returned). 0: two registered verifiers, today run by the project
attempt_fee_near = "0.01"
fee_step_near = "0.005"      # each later attempt costs this much more
reveal_gap_s = 60
reveal_window_s = 3600
verdict_window_h = 24        # must cover K x the measured proof time x 1.5 (tools/proof_times.json)
expiry_h = 96
max_patch_bytes = 1024
fuzz_count = 16
variants = 32
po2 = 18                     # proof segment size: 18 needs about 2.5 GiB of memory, 19 about 5 GiB

[secrets]                    # files of mode 600, outside the repository, never printed or committed
secret = "~/.skarbnik-vendor/mybounty/exploit.hex"   # crash: the input as hex; output: <input hex> <expected> sweep=<p>;
                                                     # rule: <call sequence hex> sweep=<p>
reference_fix = "~/.skarbnik-vendor/mybounty/fixed.wasm"

[prover]
mode = "cpu"                 # cpu: this machine. gpu: not built yet
machine = "my-laptop"        # names this machine in tools/proof_times.json (proof times differ by machine)
workdir = "~/skarbnik-vendor/mybounty"
min_avail_mib = 300          # stop a proving step if available memory falls below this

[chain]
network = "testnet"
contract = "kintsugi-l2-cihdp.testnet"
rpc_urls = ["https://test.rpc.fastnear.com", "https://rpc.testnet.near.org"]
image_id = "dd6c5f42c117ce3a842dbde60cd3fd9f255c85e322317e6bff2357b20533a2fc"   # crash checker; output mode: 005d8dc7e6fa2b936d960f6c81af51b5cb3699d319b5d4b71403dd64b051c089;
                                                                                  # rule mode: 2c7b601aeae96b0df295d2f7f7be842792637883148ec2cd26226b6018bfe6aa
vendor_account = "you.testnet"

[paths]                      # optional: where the binaries are (defaults: this repository's target/ and `near` on PATH)
# host = "~/skarbnik/bin/skarbnik-host"
# check = "~/skarbnik/bin/skarbnik-check"
# near = "~/skarbnik/bin/near"

# A watch config (tools/skarbnik-vendor watch --config <file>) has these sections instead of [bounty] and [secrets]:
# [watch]
# state = "~/skarbnik-vendor/watch_state.json"
# log = "~/skarbnik-vendor/watch.log"
# workdir = "~/skarbnik-vendor/watch-work"
# poll_s = 60
# [prover]
# mode = "gpu"                 # or "cpu"
# machine = "my-vps"
# [gpu]                        # only for mode "gpu" (docs/VENDOR.md, "GPU mode")
# api_key_file = "~/.runpod_key"   # mode 600; never printed, logged or copied
# gpu_types = ["NVIDIA L40S", "NVIDIA RTX 6000 Ada Generation", "NVIDIA L4", "NVIDIA GeForce RTX 4090", "NVIDIA L40"]
#                            (the prover build runs on NVIDIA Ada generation cards only; older types are skipped)
# data_centers = ["EU-RO-1", "EU-CZ-1", "EU-SE-1", "EU-NL-1", "US-TX-3"]
# cap_minutes = 45
# budget_usd = 6.0
# [chain]                      # as above, plus the account that signs submit_groth16; for a watch, sign through the
# network = "testnet-fastnear" # regular RPC (near-cli's "testnet" connection is the archival one)
# submit_account = "your-prover.testnet"
# [[bounties]]                 # one block per secret
# name = "mybounty"            # also names the salt: ~/.kintsugi-salts/mybounty.salt
# ids = [33]
# module = "data/mymodule"
# secret = "/path/outside/the/repository/exploit.hex"
# mode = "output"              # output or rule mode, with the reference fix every proof needs:
# reference_fix = "/path/outside/the/repository/fixed.wasm"
# rule = "data/mymodule/rule.wasm"   # rule mode only
# po2 = 18                     # for cpu proving
