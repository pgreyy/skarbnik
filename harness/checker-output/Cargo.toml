# The output checker: a second checker mode for wrong output bugs (logic bugs). A patch must return the vendor's
# expected value on the secret input, the public tests' values, and agree with the vendor's hidden reference fix on
# fresh seeded inputs and on near copies of the secret. Built on the crash checker (harness/checker) without changing
# it, so the published crash checker's image id stays the same. The command line tool is skarbnik-check-output.
[package]
name = "kintsugi-check-output"
version = "0.1.0"
edition = "2021"

[lib]
name = "kintsugi_check_output"
path = "src/lib.rs"

[[bin]]
name = "skarbnik-check-output"
path = "src/main.rs"

[dependencies]
kintsugi-check = { path = "../checker", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"], optional = true }

[features]
# The shapes the zkVM host sends into the output guest (src/lib.rs, mod zk).
zk = ["dep:serde", "kintsugi-check/zk"]
