# The proof harness. Its build script compiles the zkVM guest programs (harness/guest: hello world;
# harness/check-guest: the patch checker)
# and exposes each one's ELF (the program) and image id (its fingerprint) to the host.
[package]
name = "kintsugi-harness"
version = "0.1.0"
edition = "2021"

[build-dependencies]
risc0-build = "=3.0.6"
# Image ids of prebuilt guests (KINTSUGI_PREBUILT_GUESTS, see build.rs); the version risc0-build 3.0.6 uses.
risc0-binfmt = { version = "=3.0.5", default-features = false, features = ["std"] }

[package.metadata.risc0]
methods = ["guest", "check-guest"]
