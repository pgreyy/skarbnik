# The zkVM guest for spikes S1 and S2: runs the patch checker inside the RISC Zero machine and
# publishes only the journal (hashes, seed, counts and PASS or FAIL). Its own workspace, built by harness/build.rs.
[package]
name = "check_guest"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
# "heap-embedded-alloc": a real allocator that reuses freed memory. The default bump allocator never
# frees, so every fresh wasmi instance landed on new memory pages, which the prover pays for each time.
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std", "heap-embedded-alloc"] }
kintsugi-check = { path = "../checker", default-features = false, features = ["zk"] }
